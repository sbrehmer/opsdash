# yaml-language-server: $schema=http://localhost:4400/schema/config.v1.json
#
# Production environment: production Jira, GitHub and Jenkins.
# Secrets: copy config/env/production.env.example to config/env/production.env (or set the variables in the service environment) and fill it in.
# Set up the store with: pnpm db:setup production   Start with: pnpm start:prod
version: 1

include:
  - dashboards/delivery.yaml

defaults:
  refreshInterval: 60s
  cacheWindow: 30s
  timeout: 10s

theme:
  mode: system

plugins:
  jira:
    version: "^1.0.0"
    settings:
      deployment: cloud                 # cloud | datacenter
      baseUrl: https://acme.atlassian.net
      email: ops-bot@acme.example       # cloud only
      token: { env: JIRA_TOKEN }
      projectKeys: [PROJ]
  github:
    version: "^1.0.0"
    settings:
      apiUrl: https://api.github.com/graphql      # GHES: https://github.acme.example/api/graphql
      webUrl: https://github.com
      token: { env: GITHUB_TOKEN }
      defaultRepo: acme/web
  jenkins:
    version: "^1.0.0"
    settings:
      baseUrl: https://ci.acme.example
      user: ops-bot
      token: { env: JENKINS_TOKEN }
      pipelineTemplate: "acme/{name}"
      defaultOwner: acme
      mainBranch: main
      runningRefreshInterval: 10s
  delivery:
    version: "^1.0.0"
